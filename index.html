<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-router-dom/6.3.0/react-router-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { BrowserRouter, Routes, Route, useParams } = window.ReactRouterDOM;

    function InvitationPage() {
        const { id } = useParams();
        return <h1>Hello, {id || 'Guest'}!</h1>;
    }

    function App() {
        return (
            <BrowserRouter>
                <Routes>
                    <Route path="/:id" element={<InvitationPage />} />
                    <Route path="/" element={<InvitationPage />} />
                </Routes>
            </BrowserRouter>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
